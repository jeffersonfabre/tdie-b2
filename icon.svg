<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13427a"/>
      <stop offset="1" stop-color="#0b2545"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e6fd9"/>
      <stop offset="1" stop-color="#12c25f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- trilha da barra de progresso -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="34"/>
  <!-- progresso ~86% (meta B2) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"
          stroke-dasharray="951 1106" transform="rotate(-90 256 256)"/>
  <!-- seta de subida -->
  <path d="M256 118 l34 40 h-21 v26 h-26 v-26 h-21z" fill="#f28c28"/>
  <text x="256" y="330" text-anchor="middle" font-family="Sora, Arial Black, Arial, sans-serif"
        font-weight="800" font-size="148" fill="#ffffff" letter-spacing="-4">B2</text>
  <text x="256" y="382" text-anchor="middle" font-family="Sora, Arial, sans-serif"
        font-weight="700" font-size="36" fill="#f28c28" letter-spacing="8">TDIE</text>
</svg>
